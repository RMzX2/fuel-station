<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛽ Fuel Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Barlow+Condensed:wght@400;600;700;800&family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Sarabun', sans-serif;
  background: #f4f3ef;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,0,0,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.035) 1px, transparent 1px);
  background-size: 44px 44px;
  pointer-events: none;
  z-index: 0;
}

/* ─── SCENE ─────────────────────────────── */
.scene {
  position: relative;
  display: flex;
  align-items: center;
  z-index: 1;
}

/* ─── NOZZLE ─────────────────────────────── */
.nozzle-assy {
  position: relative;
  z-index: 2;
  margin-right: -3px;
}

.nozzle-body {
  width: 54px;
  height: 44px;
  background: #ffffff;
  border: 3px solid #111;
  border-right: none;
  border-radius: 8px 0 0 14px;
  position: relative;
}

.nozzle-hook {
  width: 20px;
  height: 20px;
  background: #f0f0f0;
  border: 3px solid #111;
  border-radius: 3px;
  position: absolute;
  right: -20px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 3;
}

.nozzle-hose {
  position: absolute;
  bottom: -54px;
  right: -5px;
  width: 3px;
  height: 52px;
  background: #222;
  border-radius: 2px;
}

/* ─── PUMP BODY ─────────────────────────── */
.pump {
  width: 296px;
  background: #ffffff;
  border: 3px solid #111;
  border-radius: 16px 16px 5px 5px;
  box-shadow: 10px 10px 0 #111;
  overflow: hidden;
  position: relative;
}

/* side indicator lights */
.side-lights {
  position: absolute;
  top: 52px;
  right: 9px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  z-index: 5;
}
.s-light {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #ddd;
  border: 1.5px solid #ccc;
  transition: background 0.3s, box-shadow 0.3s;
}
.s-light.on {
  background: #39ff14;
  border-color: #2bc410;
  box-shadow: 0 0 7px #39ff14, 0 0 14px rgba(57,255,20,0.3);
}

/* ─── PUMP HEADER ────────────────────────── */
.pump-header {
  background: #111;
  padding: 10px 16px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.header-blink {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: #39ff14;
  box-shadow: 0 0 8px #39ff14;
  animation: blink 2.2s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes blink {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.2; transform: scale(0.8); }
}
.header-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 6px;
  color: #ffffff;
  text-transform: uppercase;
}

/* ─── PUMP INNER ─────────────────────────── */
.pump-inner { padding: 14px 15px 16px; }

/* ─── DISPLAY ────────────────────────────── */
.display {
  background: #030d04;
  border: 2px solid #172417;
  border-radius: 7px;
  padding: 13px 14px 11px;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
}
/* top glow line */
.display::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent 5%, rgba(57,255,20,0.35) 50%, transparent 95%);
}
/* scanlines */
.display::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent 0, transparent 3px,
    rgba(0,0,0,0.12) 3px, rgba(0,0,0,0.12) 4px
  );
  pointer-events: none;
  z-index: 1;
}
.disp-in { position: relative; z-index: 2; }

.disp-lbl {
  font-family: 'Orbitron', monospace;
  font-size: 8px;
  color: rgba(57,255,20,0.4);
  letter-spacing: 3px;
  margin-bottom: 3px;
}
.disp-fuel-type {
  font-family: 'Orbitron', monospace;
  font-size: 17px;
  font-weight: 900;
  color: #ffaa00;
  letter-spacing: 4px;
  text-shadow: 0 0 12px rgba(255,170,0,0.7);
  line-height: 1;
  margin-bottom: 10px;
  min-height: 20px;
}
.disp-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}
.disp-liters {
  font-family: 'Orbitron', monospace;
  font-size: 30px;
  font-weight: 900;
  color: #39ff14;
  letter-spacing: 1px;
  line-height: 1;
  text-shadow: 0 0 22px rgba(57,255,20,0.65), 0 0 44px rgba(57,255,20,0.2);
}
.disp-liters .unit {
  font-size: 12px;
  font-weight: 400;
  opacity: 0.6;
  margin-left: 2px;
}
.disp-price {
  font-family: 'Orbitron', monospace;
  font-size: 17px;
  font-weight: 700;
  color: #ffaa00;
  text-shadow: 0 0 12px rgba(255,170,0,0.5);
  text-align: right;
}
.disp-price .unit { font-size: 10px; opacity: 0.6; margin-right: 1px; }

.disp-ppl {
  font-family: 'Orbitron', monospace;
  font-size: 8.5px;
  color: rgba(255,170,0,0.4);
  letter-spacing: 1px;
  margin-top: 2px;
  text-align: right;
}

.disp-status {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  color: rgba(57,255,20,0.35);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-top: 7px;
  min-height: 12px;
  transition: color 0.3s;
}
.disp-status.active { color: rgba(57,255,20,0.7); }

/* ─── SECTION LABEL ──────────────────────── */
.sec-lbl {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 3.5px;
  color: #aaa;
  text-transform: uppercase;
  margin-bottom: 8px;
}

/* ─── FUEL BUTTONS ───────────────────────── */
.fuel-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
  margin-bottom: 14px;
}
.f-btn {
  background: #f6f6f6;
  border: 1.5px solid #e2e2e2;
  border-radius: 5px;
  padding: 8px 3px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11.5px;
  font-weight: 700;
  color: #444;
  cursor: pointer;
  transition: all 0.13s ease;
  text-align: center;
  letter-spacing: 0.4px;
  -webkit-user-select: none;
  user-select: none;
}
.f-btn:hover { background: #111; color: #fff; border-color: #111; transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.18); }
.f-btn.active { background: #111; color: #39ff14; border-color: #111; box-shadow: inset 0 0 0 1px rgba(57,255,20,0.3), 0 0 0 2px rgba(57,255,20,0.12); }
.f-btn:disabled { pointer-events: none; opacity: 0.45; }

/* ─── PRICE INPUT ────────────────────────── */
.price-wrap {
  position: relative;
  margin-bottom: 12px;
}
.price-prefix {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  font-family: 'Orbitron', monospace;
  font-size: 13px;
  font-weight: 700;
  color: #bbb;
  pointer-events: none;
}
.price-input {
  width: 100%;
  padding: 12px 14px 12px 34px;
  border: 2px solid #e2e2e2;
  border-radius: 6px;
  font-family: 'Orbitron', monospace;
  font-size: 19px;
  font-weight: 700;
  color: #111;
  background: #fafafa;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  -moz-appearance: textfield;
}
.price-input:focus { border-color: #111; background: #fff; box-shadow: 0 0 0 3px rgba(0,0,0,0.07); }
.price-input::-webkit-outer-spin-button,
.price-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.price-input::placeholder { font-family: 'Sarabun', sans-serif; font-size: 13px; font-weight: 300; color: #ccc; }
.price-input:disabled { background: #f0f0f0; color: #999; }

/* ─── UPLOAD ZONE ────────────────────────── */
.upload-zone {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  width: 100%;
  min-height: 70px;
  border: 2px dashed #d0d0d0;
  border-radius: 7px;
  cursor: pointer;
  margin-bottom: 12px;
  padding: 10px;
  background: #fafafa;
  transition: border-color 0.2s, background 0.2s;
  position: relative;
  overflow: hidden;
}
.upload-zone:hover { border-color: #111; background: #f5f5f5; }
.upload-zone.has-image { border-style: solid; border-color: #111; padding: 0; min-height: 80px; }
.upload-icon { font-size: 22px; line-height: 1; }
.upload-text { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; color: #555; letter-spacing: 1px; }
.upload-sub  { font-size: 10px; color: #bbb; }
.upload-preview {
  display: none;
  width: 100%;
  max-height: 120px;
  object-fit: contain;
  border-radius: 5px;
}
.upload-zone.has-image .upload-icon,
.upload-zone.has-image .upload-text,
.upload-zone.has-image .upload-sub { display: none; }
.upload-zone.has-image .upload-preview { display: block; }

/* ─── FILL BUTTON ────────────────────────── */
.btn-fill {
  width: 100%;
  padding: 14px;
  background: #111;
  color: #39ff14;
  border: none;
  border-radius: 7px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15.5px;
  font-weight: 800;
  letter-spacing: 4px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 8px;
  position: relative;
  overflow: hidden;
}
.btn-fill::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, transparent 30%, rgba(57,255,20,0.1) 50%, transparent 70%);
  transform: translateX(-100%);
  transition: transform 0.5s;
}
.btn-fill:hover:not(:disabled)::after { transform: translateX(100%); }
.btn-fill:hover:not(:disabled) { background: #39ff14; color: #111; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(57,255,20,0.35); }
.btn-fill:disabled { background: #555; color: #888; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-fill.fueling { background: #1a2e1a; color: #39ff14; }
.btn-fill.fueling::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(57,255,20,0.08), transparent);
  animation: shimmer 1.6s infinite;
}
@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

/* ─── STOP BUTTON ────────────────────────── */
.btn-stop {
  width: 100%;
  padding: 10px;
  background: transparent;
  color: #dd2020;
  border: 2px solid #dd2020;
  border-radius: 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s, opacity 0.25s, transform 0.25s;
  opacity: 0;
  pointer-events: none;
  transform: translateY(5px);
}
.btn-stop.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.btn-stop:hover { background: #dd2020; color: #fff; box-shadow: 0 4px 14px rgba(221,32,32,0.28); }

/* ─── RESET BUTTON ───────────────────────── */
.btn-reset {
  width: 100%;
  padding: 9px;
  background: transparent;
  color: #888;
  border: 1.5px solid #ddd;
  border-radius: 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s, opacity 0.25s, transform 0.25s;
  opacity: 0;
  pointer-events: none;
  transform: translateY(5px);
  margin-top: 8px;
}
.btn-reset.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.btn-reset:hover { background: #111; color: #fff; border-color: #111; }

/* ─── PUMP BOTTOM STRIPE ─────────────────── */
.pump-stripe {
  height: 11px;
  background: repeating-linear-gradient(
    90deg,
    #111 0, #111 13px,
    #fff 13px, #fff 18px
  );
  border-top: 2.5px solid #111;
}

/* ─── TOAST ──────────────────────────────── */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(90px);
  background: #111;
  color: #39ff14;
  padding: 13px 28px;
  border-radius: 7px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
  box-shadow: 0 6px 28px rgba(0,0,0,0.28);
  transition: transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.2s;
  z-index: 1000;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="scene">

  <!-- Nozzle assembly -->
  <div class="nozzle-assy">
    <div class="nozzle-body">
      <div class="nozzle-hook"></div>
      <div class="nozzle-hose"></div>
    </div>
  </div>

  <!-- Pump -->
  <div class="pump">

    <!-- Side indicator lights -->
    <div class="side-lights">
      <div class="s-light" id="sl1"></div>
      <div class="s-light" id="sl2"></div>
      <div class="s-light" id="sl3"></div>
    </div>

    <!-- Header -->
    <div class="pump-header">
      <div class="header-blink"></div>
      <div class="header-title">⛽&nbsp; Fuel Station</div>
    </div>

    <!-- Inner content -->
    <div class="pump-inner">

      <!-- Display screen -->
      <div class="display">
        <div class="disp-in">
          <div class="disp-lbl">FUEL TYPE</div>
          <div class="disp-fuel-type" id="dispFuel">— — —</div>
          <div class="disp-row">
            <div class="disp-liters" id="dispLiters">00.00<span class="unit">L</span></div>
            <div style="text-align:right">
              <div class="disp-price" id="dispPrice"><span class="unit">฿</span>0.00</div>
              <div class="disp-ppl" id="dispPpl">฿0.00 / L</div>
            </div>
          </div>
          <div class="disp-status" id="dispStatus">READY</div>
        </div>
      </div>

      <!-- Fuel type -->
      <div class="sec-lbl"></div>
      <div class="fuel-grid" id="fuelGrid">
        <button class="f-btn" data-fuel="B7"      data-ppl="33.34">B7</button>
        <button class="f-btn" data-fuel="B10"     data-ppl="32.94">B10</button>
        <button class="f-btn" data-fuel="B20"     data-ppl="31.54">B20</button>
        <button class="f-btn" data-fuel="91"      data-ppl="36.56">91</button>
        <button class="f-btn" data-fuel="95"      data-ppl="40.24">95</button>
        <button class="f-btn" data-fuel="E20"     data-ppl="33.34">E20</button>
        <button class="f-btn" data-fuel="E85"     data-ppl="24.99">E85</button>
        <button class="f-btn" data-fuel="Gasohol" data-ppl="35.00" style="font-size:9.5px;letter-spacing:0">GAS</button>
      </div>

      <!-- Price input -->
      <div class="sec-lbl"></div>
      <div class="price-wrap">
        <span class="price-prefix">$</span>
        <input type="number" id="priceInput" class="price-input"
               placeholder="" min="1" max="99999" step="1">
      </div>

      <!-- Buttons -->
      <button class="btn-fill" id="btnFill" onclick="startFueling()">
        ⛽&nbsp;&nbsp;Fill
      </button>
      <button class="btn-stop" id="btnStop" onclick="stopFueling()">
        ■&nbsp;&nbsp;STOP
      </button>
      <button class="btn-reset" id="btnReset" onclick="resetAll()">
        ↺&nbsp;&nbsp;RETRY
      </button>

    </div>

    <div class="pump-stripe"></div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast">📄 ดาวน์โหลดใบเสร็จแล้ว!</div>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
// ── STATE ────────────────────────────────────────────────────────────────
let selectedFuel = null;
let pricePerLiter = 35;
let isRefueling   = false;
let animTimer     = null;
let currentLiters = 0;
let currentAmount = 0;
let targetAmount  = 0;

// ── FUEL SELECTION ───────────────────────────────────────────────────────
document.querySelectorAll('.f-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (isRefueling) return;
    document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedFuel  = btn.dataset.fuel;
    pricePerLiter = parseFloat(btn.dataset.ppl) || 35;
    document.getElementById('dispFuel').textContent  = selectedFuel.toUpperCase();
    document.getElementById('dispPpl').textContent   = '฿' + pricePerLiter.toFixed(2) + ' / L';
    resetDisplay();
  });
});

function resetDisplay() {
  currentLiters = 0;
  currentAmount = 0;
  setDisplayValues(0, 0);
  setStatus('READY', false);
}

function setDisplayValues(liters, amount) {
  document.getElementById('dispLiters').innerHTML =
    liters.toFixed(2) + '<span class="unit">L</span>';
  document.getElementById('dispPrice').innerHTML =
    '<span class="unit">฿</span>' + amount.toFixed(2);
}

function setStatus(text, active) {
  const el = document.getElementById('dispStatus');
  el.textContent = text;
  active ? el.classList.add('active') : el.classList.remove('active');
}

function setLights(on) {
  ['sl1','sl2','sl3'].forEach((id, i) => {
    setTimeout(() => {
      const el = document.getElementById(id);
      on ? el.classList.add('on') : el.classList.remove('on');
    }, i * 140);
  });
}

// ── START FUELING ────────────────────────────────────────────────────────
function startFueling() {
  if (!selectedFuel) {
    toast('⚠  SELECT FUEL TYPE', '#ffaa00');
    setStatus('SELECT FUEL TYPE', false);
    return;
  }
  const priceVal = parseFloat(document.getElementById('priceInput').value);
  if (!priceVal || priceVal <= 0) {
    toast('⚠  Please enter amount', '#ffaa00');
    setStatus('ENTER AMOUNT', false);
    return;
  }

  targetAmount  = priceVal;
  currentLiters = 0;
  currentAmount = 0;
  isRefueling   = true;

  // UI state
  document.getElementById('btnFill').disabled = true;
  document.getElementById('btnFill').classList.add('fueling');
  document.getElementById('btnFill').innerHTML = '⏳&nbsp;&nbsp;FUELING...';
  document.getElementById('btnStop').classList.add('show');
  document.getElementById('btnReset').classList.remove('show');
  document.getElementById('priceInput').disabled = true;
  document.querySelectorAll('.f-btn').forEach(b => b.disabled = true);
  setStatus('DISPENSING...', true);
  setLights(true);

  const totalLiters = targetAmount / pricePerLiter;
  // Duration 3–12 s, scaled by liters
  const duration = Math.min(Math.max(totalLiters * 550, 3000), 12000);
  const STEPS = 80;
  const interval = duration / STEPS;
  let step = 0;

  animTimer = setInterval(() => {
    step++;
    const t = step / STEPS;
    const ease = easeInOut(t);
    currentLiters = totalLiters * ease;
    currentAmount = targetAmount * ease;
    setDisplayValues(currentLiters, currentAmount);

    if (step >= STEPS) {
      clearInterval(animTimer);
      currentLiters = totalLiters;
      currentAmount = targetAmount;
      setDisplayValues(currentLiters, currentAmount);
      finishFueling(true);
    }
  }, interval);
}

function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
}

// ── STOP ─────────────────────────────────────────────────────────────────
function stopFueling() {
  if (!isRefueling) return;
  clearInterval(animTimer);
  isRefueling = false;
  finishFueling(false);
}

// ── FINISH ───────────────────────────────────────────────────────────────
function finishFueling(full) {
  isRefueling = false;
  document.getElementById('btnFill').disabled  = false;
  document.getElementById('btnFill').classList.remove('fueling');
  document.getElementById('btnFill').innerHTML  = '⛽&nbsp;&nbsp;Fill';
  document.getElementById('btnStop').classList.remove('show');
  document.getElementById('btnReset').classList.add('show');
  document.getElementById('priceInput').disabled = false;
  document.querySelectorAll('.f-btn').forEach(b => b.disabled = false);
  setStatus(full ? 'COMPLETE ✓' : 'STOPPED', false);

  setTimeout(() => {
    generatePDF();
    toast('COMPLETE!', '#39ff14');
    setLights(false);
  }, 500);
}

// ── RESET ALL ─────────────────────────────────────────────────────────────
function resetAll() {
  clearInterval(animTimer);
  isRefueling   = false;
  selectedFuel  = null;
  pricePerLiter = 35;
  currentLiters = 0;
  currentAmount = 0;
  targetAmount  = 0;

  document.querySelectorAll('.f-btn').forEach(b => {
    b.classList.remove('active');
    b.disabled = false;
  });

  document.getElementById('priceInput').value   = '';
  document.getElementById('priceInput').disabled = false;
  document.getElementById('btnFill').disabled   = false;
  document.getElementById('btnFill').classList.remove('fueling');
  document.getElementById('btnFill').innerHTML  = '⛽&nbsp;&nbsp;Fill';
  document.getElementById('btnStop').classList.remove('show');
  document.getElementById('btnReset').classList.remove('show');
  document.getElementById('dispFuel').textContent = '— — —';

}

// ── TOAST ─────────────────────────────────────────────────────────────────
function toast(msg, color) {
  const el = document.getElementById('toast');
  el.textContent  = msg;
  el.style.color  = color || '#39ff14';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3200);
}

let uploadedImageType = 'image/png';

// ── GENERATE PDF ──────────────────────────────────────────────────────────
function generatePDF() {
  if (!window.jspdf) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p', 'mm', 'a4');
  const W = 210, H = 297;

  // พื้นขาว
  doc.setFillColor(255, 255, 255);
  doc.rect(0, 0, W, H, 'F');

  if (uploadedImageBase64) {
    const img = new Image();
    img.src = uploadedImageBase64;
    const natW = img.naturalWidth  || 800;
    const natH = img.naturalHeight || 800;

    // Fit เต็มหน้า A4 พร้อม padding
    const maxW = 190, maxH = 277;
    let iw = maxW, ih = (natH / natW) * maxW;
    if (ih > maxH) { ih = maxH; iw = (natW / natH) * maxH; }

    const ix = (W - iw) / 2;
    const iy = (H - ih) / 2;

    let fmt = 'PNG';
    if (uploadedImageType === 'image/jpeg' || uploadedImageType === 'image/jpg') fmt = 'JPEG';
    else if (uploadedImageType === 'image/webp') fmt = 'WEBP';

    doc.addImage(uploadedImageBase64, fmt, ix, iy, iw, ih);
  }

  const fname = 'fuel-' + (selectedFuel||'tank').toLowerCase().replace('/','') + '-' + Date.now() + '.pdf';
  doc.save(fname);
}
